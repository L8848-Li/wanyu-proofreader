# Browser uploads use 1 MiB chunks; shared Traefik changes are optional.
# Legacy slow whole-file uploads: see docs/operations.md and ops/prepare_upload_timeout.py.
services:
  backend:
    build:
      context: ./backend
      args:
        # Images must be identifiable after the fact; see docs/operations.md.
        VERSION: ${FANGJI_VERSION:-dev}
        COMMIT: ${FANGJI_COMMIT:-unknown}
        BUILD_DATE: ${FANGJI_BUILD_DATE:-unknown}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    environment:
      - APP_ADMIN_EMAIL=${APP_ADMIN_EMAIL:-}
      - APP_ADMIN_PASSWORD=${APP_ADMIN_PASSWORD:-}
      - APP_ADMIN_NAME=${APP_ADMIN_NAME:-管理员}
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:-}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:-}
      - PB_ALLOWED_ORIGINS=${PB_ALLOWED_ORIGINS:-}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      - HINGHWA_IDENTITY_BASE_URL=${HINGHWA_IDENTITY_BASE_URL:-}
    volumes:
      - ./pb_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
    networks:
      - app

  frontend:
    build:
      context: ./frontend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik-global-proxy}"
      - "traefik.http.routers.fangji.rule=Host(`${TRAEFIK_HOST:?Set TRAEFIK_HOST, for example fangji.example.com}`)"
      - "traefik.http.routers.fangji.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.fangji.tls=true"
      - "traefik.http.routers.fangji.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.fangji.service=fangji"
      - "traefik.http.routers.fangji.middlewares=fangji-security"
      - "traefik.http.middlewares.fangji-security.headers.stsseconds=31536000"
      - "traefik.http.middlewares.fangji-security.headers.forcestsheader=false"
      - "traefik.http.services.fangji.loadbalancer.server.port=8080"
    environment:
      - VITE_BACKEND_URL=${BACKEND_URL:-}
      - ENABLE_POCKETBASE_ADMIN_UI=${ENABLE_POCKETBASE_ADMIN_UI:-true}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
    networks:
      - app
      - traefik

networks:
  app:
  traefik:
    name: "${TRAEFIK_NETWORK:-traefik-global-proxy}"
    external: true
