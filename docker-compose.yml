services:
  backend:
    build:
      context: ./backend
      args:
        # Images must be identifiable after the fact; see docs/operations.md.
        VERSION: ${FANGJI_VERSION:-dev}
        COMMIT: ${FANGJI_COMMIT:-unknown}
        BUILD_DATE: ${FANGJI_BUILD_DATE:-unknown}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    environment:
      - APP_ADMIN_EMAIL=${APP_ADMIN_EMAIL:-}
      - APP_ADMIN_PASSWORD=${APP_ADMIN_PASSWORD:-}
      - APP_ADMIN_NAME=${APP_ADMIN_NAME:-管理员}
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:-}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:-}
      - PB_ALLOWED_ORIGINS=${PB_ALLOWED_ORIGINS:-}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      - HINGHWA_IDENTITY_BASE_URL=${HINGHWA_IDENTITY_BASE_URL:-}
    volumes:
      # Persist PocketBase data on the host for easy backup and migration.
      - ./pb_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    environment:
      - VITE_BACKEND_URL=${BACKEND_URL:-}
      - ENABLE_POCKETBASE_ADMIN_UI=${ENABLE_POCKETBASE_ADMIN_UI:-false}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
